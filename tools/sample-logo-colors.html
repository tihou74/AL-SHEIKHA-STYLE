<!doctype html>
<!--
  قياس ألوان الشعار من بكسلاته مباشرة.
  يُفتح بمسار file:// مطلق، ويُقرأ الناتج من العنصر #out.
  السبب: البيئة بلا مكتبات صور (pip و npm محجوبان)، والمتصفّح يفكّ JPEG بنفسه.
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>قياس ألوان الشعار</title>
  <style>
    body { font-family: monospace; background: #fff; color: #111; padding: 16px; }
    pre { font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
<pre id="out">جارٍ القياس...</pre>
<script>
// مسار نسبي: المتصفّح هنا يمنع بروتوكول file:، فيُقدَّم المجلّد عبر خادم محلّي
const SRC = '../brand/al-sheikha-style-logo-899x1600.jpg';

const hex = (r, g, b) =>
  '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0').toUpperCase()).join('');

function hsl(r, g, b) {
  const rr = r / 255, gg = g / 255, bb = b / 255;
  const max = Math.max(rr, gg, bb), min = Math.min(rr, gg, bb);
  const l = (max + min) / 2;
  const d = max - min;
  if (d === 0) return { h: 0, s: 0, l };
  const s = d / (1 - Math.abs(2 * l - 1));
  let h;
  if (max === rr) h = ((gg - bb) / d) % 6;
  else if (max === gg) h = (bb - rr) / d + 2;
  else h = (rr - gg) / d + 4;
  h = Math.round(h * 60);
  if (h < 0) h += 360;
  return { h, s, l };
}

function run(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const { data } = ctx.getImageData(0, 0, c.width, c.height);

  const buckets = new Map();   // لون مقرَّب -> {n, r, g, b}  (مجموع لحساب المتوسط الحقيقي)
  let total = 0, nearWhite = 0;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
    if (a < 128) continue;
    total++;
    if (r > 243 && g > 243 && b > 243) { nearWhite++; continue; }
    // تقريب إلى شبكة 12 لتجميع تدرّجات الحرف الواحد
    const key = `${r >> 4}-${g >> 4}-${b >> 4}`;
    let e = buckets.get(key);
    if (!e) { e = { n: 0, r: 0, g: 0, b: 0 }; buckets.set(key, e); }
    e.n++; e.r += r; e.g += g; e.b += b;
  }

  const rows = [...buckets.values()].map(e => {
    const r = Math.round(e.r / e.n), g = Math.round(e.g / e.n), b = Math.round(e.b / e.n);
    return { n: e.n, r, g, b, hex: hex(r, g, b), ...hsl(r, g, b) };
  });
  rows.sort((a, b) => b.n - a.n);

  const ink = rows.filter(x => x.s < 0.18 && x.l < 0.35);
  const gold = rows.filter(x => x.h >= 20 && x.h <= 60 && x.s >= 0.18 && x.l > 0.25 && x.l < 0.8);

  const lines = [];
  lines.push('الصورة: ' + c.width + '×' + c.height + '   بكسلات مقروءة: ' + total);
  lines.push('أبيض/قريب من الأبيض: ' + (100 * nearWhite / total).toFixed(1) + '%');
  lines.push('');
  lines.push('أكثر ١٢ لوناً (غير الأبيض):');
  lines.push('  اللون      نسبة%   H    S     L');
  rows.slice(0, 12).forEach(x => {
    lines.push('  ' + x.hex + '  ' + (100 * x.n / total).toFixed(2).padStart(6) +
      '  ' + String(x.h).padStart(3) + '  ' + x.s.toFixed(2) + '  ' + x.l.toFixed(2));
  });
  lines.push('');
  lines.push('== الذهبي الأغلب (H بين 20 و60) ==');
  gold.slice(0, 5).forEach(x => lines.push('  ' + x.hex + '   ' + (100 * x.n / total).toFixed(2) + '%  L=' + x.l.toFixed(2)));
  lines.push('');
  lines.push('== الرمادي/الأسود الأغلب ==');
  ink.slice(0, 5).forEach(x => lines.push('  ' + x.hex + '   ' + (100 * x.n / total).toFixed(2) + '%  L=' + x.l.toFixed(2)));
  lines.push('');
  lines.push('JSON: ' + JSON.stringify({
    gold_main: gold[0] ? gold[0].hex : null,
    gold_list: gold.slice(0, 5).map(x => x.hex),
    ink_main: ink[0] ? ink[0].hex : null,
    white_share: +(100 * nearWhite / total).toFixed(1)
  }));

  document.getElementById('out').textContent = lines.join('\n');
  document.title = 'DONE';
}

const img = new Image();
img.onload = () => { try { run(img); } catch (e) { document.getElementById('out').textContent = 'خطأ: ' + e.message; document.title = 'ERROR'; } };
img.onerror = () => { document.getElementById('out').textContent = 'تعذّر تحميل الصورة: ' + SRC; document.title = 'ERROR'; };
img.src = SRC;
</script>
</body>
</html>
